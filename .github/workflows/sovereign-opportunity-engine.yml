name: Sovereign Opportunity Engine

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "render.yaml"
      - ".github/workflows/sovereign-opportunity-engine.yml"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "render.yaml"
      - ".github/workflows/sovereign-opportunity-engine.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Test suite
        run: npm test
