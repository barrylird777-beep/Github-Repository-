name: Opportunity Engine CI

on:
  push:
    branches: [main, apex-anchor/opportunity-engine-pure-wal]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
