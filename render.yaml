services:
  - type: web
    name: opportunity-engine
    runtime: node
    plan: free
    region: ohio
    repo: https://github.com/barrylird777-beep/Github-Repository-
    branch: main
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opportunity-engine-db
          property: connectionString
      - key: RPC_URL
        sync: false
      - key: CHAIN_ID
        value: "1"
      - key: POLL_MS
        value: "1000"
      - key: WORKER_BATCH_SIZE
        value: "8"
      - key: WAL_DIR
        value: "./data"
